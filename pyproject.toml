[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "china-stock-engine"
version = "2.0.0"
description = "Local A-share end-of-day research warehouse"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4,<3",
    "pyarrow>=18,<26",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.scripts]
stock-engine = "china_stock_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
