[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "china-stock-engine"
version = "0.2.0"
description = "Auditable iFinD-primary daily data engine for China's A-share market."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.1,<4",
    "pyarrow>=15,<24",
]

[project.scripts]
china-stock-engine = "china_stock_engine.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
