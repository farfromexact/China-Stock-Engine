name: Offline Python Tests

on:
  pull_request:
    paths: ["src/**", "tests/**", "scripts/**", ".github/workflows/**", "requirements.txt", "pyproject.toml"]
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "scripts/**", ".github/workflows/**", "requirements.txt", "pyproject.toml"]

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -r requirements.txt -e .
      - name: Parse Windows installer without executing it
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Tokens = $null
          $ParseErrors = $null
          foreach ($Path in @('scripts/setup-wind-windows.ps1', 'scripts/install-wind-local-task.ps1')) {
            $Script = (Resolve-Path $Path).Path
            $null = [System.Management.Automation.Language.Parser]::ParseFile($Script, [ref]$Tokens, [ref]$ParseErrors)
            if ($ParseErrors.Count -gt 0) { throw ($ParseErrors | Out-String) }
          }
      - name: Test without native Wind SDK
        run: python -m unittest discover -s tests -v
