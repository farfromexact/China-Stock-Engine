name: Daily China Stock Data

on:
  workflow_dispatch:
    inputs:
      trade_date:
        description: "Optional completed trade date (YYYY-MM-DD)"
        required: false
        type: string
  schedule:
    # 18:30 Asia/Shanghai, Monday through Friday.
    - cron: "30 10 * * 1-5"

permissions:
  contents: read

concurrency:
  group: daily-china-stock-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies and project
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Collect iFinD A-share snapshot
        id: collect
        continue-on-error: true
        env:
          IFIND_REFRESH_TOKEN: ${{ secrets.IFIND_REFRESH_TOKEN }}
          TRADE_DATE: ${{ inputs.trade_date }}
        shell: bash
        run: |
          if [[ -z "${IFIND_REFRESH_TOKEN}" ]]; then
            echo "IFIND_REFRESH_TOKEN secret is required." >&2
            exit 1
          fi
          if [[ -n "${TRADE_DATE}" ]]; then
            python -m china_stock_engine.cli run \
              --date "${TRADE_DATE}" \
              --data-dir "${RUNNER_TEMP}/china-stock-engine-data"
          else
            python -m china_stock_engine.cli run \
              --data-dir "${RUNNER_TEMP}/china-stock-engine-data"
          fi

      - name: Validate promoted snapshot
        id: validate
        if: steps.collect.outcome == 'success'
        run: >-
          python -m china_stock_engine.cli validate
          --data-dir "${RUNNER_TEMP}/china-stock-engine-data"

      - name: Fail job when collection failed
        if: steps.collect.outcome == 'failure'
        run: exit 1
