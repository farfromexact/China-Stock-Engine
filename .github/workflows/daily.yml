name: Daily China Stock Data

on:
  workflow_dispatch:
    inputs:
      trade_date:
        description: "Optional completed trade date (YYYY-MM-DD)"
        required: false
        type: string
  schedule:
    # 18:30 Asia/Shanghai, Monday through Friday.
    - cron: "30 10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: daily-china-stock-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies and project
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Collect iFinD A-share snapshot
        id: collect
        continue-on-error: true
        env:
          IFIND_REFRESH_TOKEN: ${{ secrets.IFIND_REFRESH_TOKEN }}
          TRADE_DATE: ${{ inputs.trade_date }}
        shell: bash
        run: |
          if [[ -z "${IFIND_REFRESH_TOKEN}" ]]; then
            echo "IFIND_REFRESH_TOKEN secret is required." >&2
            exit 1
          fi
          if [[ -n "${TRADE_DATE}" ]]; then
            python -m china_stock_engine.cli run --date "${TRADE_DATE}"
          else
            python -m china_stock_engine.cli run
          fi

      - name: Validate promoted snapshot
        id: validate
        if: steps.collect.outcome == 'success'
        run: python -m china_stock_engine.cli validate

      - name: Commit verified data
        if: steps.collect.outcome == 'success' && steps.validate.outcome == 'success'
        shell: bash
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "No verified data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): update daily A-share snapshot"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Commit observable failure status
        if: steps.collect.outcome == 'failure'
        shell: bash
        run: |
          git add data/last_run_status.json
          if git diff --cached --quiet; then
            echo "No failure-status change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): record failed A-share collection"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Fail job when collection failed
        if: steps.collect.outcome == 'failure'
        run: exit 1

